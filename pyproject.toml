[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dense-kv-communication"
version = "0.1.0"
description = "Minimal Qwen3-4B/Qwen3-8B dense KV-cache communication reproduction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.51,<4.54",
  "datasets>=2.19",
  "tqdm>=4.66",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

